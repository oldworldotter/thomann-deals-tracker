name: Tests

# Runs the offline test suite (simulated shop, no requests to Thomann) whenever the code,
# the tests or the settings change. The tracker's own result commits don't trigger it.
on:
  push:
    branches: [main]
    paths: ["tracker/**", "tests/**", "config.yml", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
