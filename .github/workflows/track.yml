name: Track deals

# Title of each run in the Actions list, so you can see what started it.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled check (GitHub cron)'
  || (inputs.force && 'Manual check' || 'Scheduled check (started by Claude)') }}

on:
  schedule:
    # GitHub's own timer. config.yml → schedule.check_every_hours decides whether a wake-up
    # actually checks. (On this repo GitHub has not been firing it; see README.)
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Check now, ignoring the schedule"
        type: boolean
        default: true

permissions:
  contents: write   # commit the results
  # issues: write   # add back if you turn on alerts.github_issue in config.yml

concurrency:
  group: track-deals
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check deals
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tracker.main

      - name: Upload page HTML for debugging
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Deals check $(python -m tracker.label)"
            git pull --rebase --autostash
            git push
          fi
