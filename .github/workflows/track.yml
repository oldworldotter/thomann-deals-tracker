name: Track deals

on:
  schedule:
    # Wakes up every hour; config.yml → schedule.check_every_hours decides whether to actually check.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Check now, ignoring the schedule"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: track-deals
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check deals
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tracker.main

      - name: Upload page HTML for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Deals check $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
